content:
  - name: pages
    label: Seiten
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: description
        label: Beschreibung
        type: string
      - name: body
        label: Inhalt
        type: rich-text
